<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Gabrielle Essence Eau De Parfum product preview card"
  >

  <title>Product Preview Card</title>

  <!-- Conecta o HTML ao CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">

    <!-- Cartão do produto -->
    <article class="product-card">

      <!-- Imagem do perfume -->
      <div class="product-image">
        <img
          src="./images/image-product-desktop.jpg"
          alt="Gabrielle Chanel perfume bottle surrounded by green leaves"
        >
      </div>

      <!-- Informações do produto -->
      <section class="product-info">

        <p class="eyebrow">Perfume</p>

        <h1>Gabrielle Essence Eau De Parfum</h1>

        <!-- Descrição -->
        <p class="description">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <!-- Preços -->
        <div class="price-row">
          <span class="price">$149.99</span>
          <s class="old-price">$169.99</s>
        </div>
        

        <!-- Botão visual -->
        <button class="cart-button" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 4h2l2.2 10.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H6" />
            <circle cx="10" cy="19" r="1.3" />
            <circle cx="18" cy="19" r="1.3" />
          </svg>

          <span>Add to Cart</span>
        </button>

      </section>
    </article>
  </main>
</body>
</html>



  

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Arthur Bucchino</a>.
  </footer>
</body>
</html>
